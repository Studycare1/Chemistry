            color: var(--text-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Neomorphic Styles */
        .neo-box {
            background: var(--bg-color);
            border-radius: 20px;
            box-shadow: 9px 9px 16px var(--shadow-dark), 
                       -9px -9px 16px var(--shadow-light);
            padding: 25px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 800px;
        }

        .neo-inset {
            background: var(--bg-color);
            border-radius: 15px;
            box-shadow: inset 6px 6px 10px var(--shadow-dark), 
                        inset -6px -6px 10px var(--shadow-light);
            padding: 15px;
        }

        /* Header & Score */
        header {
            position: sticky;
            top: 10px;
            z-index: 100;
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            transition: all 0.3s ease;

        .score-display {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary);
        }

        .score-green { color: var(--green); }
        .score-red { color: var(--red); }

        h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        /* MCQ Styles */
        .question-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-container {
                grid-template-columns: 1fr;
            }
        }

        .option {
            background: var(--bg-color);
            border: none;
            padding: 15px 20px;
            border-radius: 15px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 6px 6px 12px var(--shadow-dark), 
                       -6px -6px 12px var(--shadow-light);
            transition: all 0.2s ease;
            color: var(--text-color);
            text-align: left;
        }

        .option:hover {
            box-shadow: 4px 4px 8px var(--shadow-dark), 
                       -4px -4px 8px var(--shadow-light);
        }

        .option:active {
            box-shadow: inset 6px 6px 10px var(--shadow-dark), 
                        inset -6px -6px 10px var(--shadow-light);
        }

        .option.correct {
            box-shadow: inset 6px 6px 10px rgba(46, 204, 113, 0.4), 
                        inset -6px -6px 10px var(--shadow-light);
            color: var(--green);
            font-weight: 600;
        }

        .option.wrong {
            box-shadow: inset 6px 6px 10px rgba(231, 76, 60, 0.4), 
                        inset -6px -6px 10px var(--shadow-light);
            color: var(--red);
            font-weight: 600;
        }

        /* Explanation / Reason */
        .reason-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            font-size: 0.95rem;
            border-left: 4px solid var(--primary);
            animation: slideDown 0.4s ease forwards;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Subjective Section */
        .subjective-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: 600;
            box-shadow: 4px 4px 8px var(--shadow-dark), 
                       -4px -4px 8px var(--shadow-light);
            transition: 0.2s;
        }

        .subjective-btn:active {
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.2);
        }

        .subjective-answer {
            display: none;
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            background: #e0e5ec;
            box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                        inset -4px -4px 8px var(--shadow-light);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .section-title {
            text-align: center;
            font-size: 1.5rem;
            margin: 40px 0 20px 0;
            color: var(--primary);
            text-shadow: 2px 2px 4px var(--shadow-light);
        }

    </style>
</head>

                q: "64. The product of the reaction CH3CN --(H3O+)--> is:",
                options: ["CH3COOH", "CH3CH2NHOH", "CH3CONH2", "CH3CHO"],
                correct: 0,
                reason: "Acid hydrolysis of a nitrile (CH3CN) yields the corresponding carboxylic acid (CH3COOH)."
            },
            {
                q: "65. Which of the following bonds is the strongest?",
                options: ["F-F", "Cl-Cl", "I-I", "Br-Br"],
                correct: 1,
                reason: "Cl-Cl has the highest bond dissociation enthalpy among halogens due to a balance of size and lone-pair repulsions."
            },
            {
                q: "66. Vitamin A is called:",
                options: ["Ascorbic acid", "Retinol", "Calciferol", "Tocopherol"],
                correct: 1,
                reason: "Vitamin A is Retinol. Ascorbic is C, Calciferol is D, Tocopherol is E."
            },
            {
                q: "67. The metal always found in a free state is:",
                options: ["Gold", "Silver", "Copper", "Sodium"],
                correct: 0,
                reason: "Gold (Au) is a noble metal and is highly unreactive, often found in its native/free state."
            },
            {
                q: "68. The best way to prevent iron from rusting is:",
                options: ["By making iron the cathode", "By keeping it in salt water", "Both (A) and (B)", "None of these"],
                correct: 0,
                reason: "Making iron the cathode in an electrochemical cell prevents it from oxidizing (cathodic protection)."
            },
            {
                q: "69. What is ethoxy ethane?",
                options: ["C2H5OCH3", "CH3OCH3", "C2H5OC2H5", "None of these"],
                correct: 2,
                reason: "Ethoxy ethane is diethyl ether (C2H5-O-C2H5)."
            },
            {
                q: "70. Which of the following has a benzene ring?",
                options: ["Chlorophyll", "Haemocyanin", "Carbonic anhydrase", "Vitamin"],
                correct: 3,
                reason: "Many vitamins (like Vitamin K, E) contain aromatic/benzene rings. Chlorophyll has a porphyrin ring, not benzene."
            }
        ];

        const subjectiveQs = [
            {
                q: "1. What do you understand by a storage battery?",
                a: "A storage battery (or secondary cell) is an electrochemical cell that can be recharged by passing an electric current through it in the reverse direction. Examples include Lead-acid batteries and Lithium-ion batteries."
            },
            {
                q: "2. Write the electronic configuration of the following elements: (i) V (Z = 23) (ii) Zn (Z = 30)",
                a: "(i) Vanadium (V, Z=23): [Ar] 3d3 4s2\n(ii) Zinc (Zn, Z=30): [Ar] 3d10 4s2"
            },
            {
                q: "3. The bond angle of PH3 is larger than that of NH3. Why? (Wait, standard chemistry says NH3 > PH3. The question likely says 'is smaller' or asks why they differ. Let's provide the standard factual reason).",
                a: "Actually, the bond angle of NH3 (107°) is larger than PH3 (93.5°). This is because Nitrogen is more electronegative, so the bond pairs in NH3 are closer to N, causing greater repulsion between them. In PH3, P is less electronegative, so bond pairs are further away, and the lone pair-bond pair repulsion dominates, reducing the angle to almost 90°."
            },
            {
                q: "4. Complete the following acid-base reactions: (i) CH3CH2CH2NH2 + HCl -> (ii) (C2H5)3N + HCl ->",
                a: "(i) CH3CH2CH2NH2 + HCl -> CH3CH2CH2NH3+ Cl- (Propylammonium chloride)\n(ii) (C2H5)3N + HCl -> (C2H5)3NH+ Cl- (Triethylammonium chloride)"
            },
            {
                q: "5. Phenol is more acidic than alcohol. Why?",
                a: "Phenol is more acidic because the phenoxide ion (conjugate base) is stabilized by resonance with the benzene ring. The negative charge is delocalized over the ring. In alcohols, the alkoxide ion lacks this resonance stabilization."
            },
            {
                q: "6. Lithium forms a BCC lattice. Calculate the atomic radius of lithium, if the edge length of its unit cell is 351 pm.",
                a: "For BCC lattice, r = (√3 * a) / 4.\nGiven a = 351 pm.\nr = (1.732 * 351) / 4 = 607.9 / 4 = 151.98 pm ≈ 152 pm."
            },
            {
                q: "7. Differentiate between methanoic acid and ethanoic acid.",
                a: "Methanoic acid (HCOOH) has both an aldehyde (-CHO) and a carboxyl (-COOH) group, so it acts as a reducing agent (gives Tollens' test). Ethanoic acid (CH3COOH) does not have an aldehyde group and does not show reducing properties."
            },
            {
                q: "8. The atomic radii of noble gases are comparatively larger. Why?",
                a: "Noble gases have a stable, completely filled valence shell (ns2 np6). The atomic radius is measured as covalent radius or van der Waals radius. Since they generally don't form bonds, their measured radii are van der Waals radii, which are larger than covalent radii of other elements."
            },
            {
                q: "9. What are the factors that affect the adsorption of a gas on a solid?",
                a: "Factors include: 1. Nature of the gas (easily liquefiable gases adsorb more). 2. Surface area of the adsorbent. 3. Temperature (physisorption decreases, chemisorption increases with temp). 4. Pressure (higher pressure increases adsorption)."
            },
            {
                q: "10. Methyl amine is more basic than aniline. Give reason.",
                a: "In methyl amine, the methyl group is electron-donating (+I effect), which increases electron density on nitrogen, making the lone pair easily available. In aniline, the lone pair on nitrogen is delocalized into the benzene ring via resonance, making it less available for protonation."
            },
            {
                q: "11. Which products are formed in the hydrolysis of lactose?",
                a: "Lactose is a disaccharide. Upon hydrolysis, it yields one molecule of D-glucose and one molecule of D-galactose."
            },
            {
                q: "12. What is a double salt? Explain with an example.",
                a: "A double salt is a crystalline salt that contains two different cations or anions and crystallizes as a single entity from a solution containing a mixture of salts. In aqueous solution, it dissociates into all its constituent ions. Example: Mohr's salt, FeSO4.(NH4)2SO4.6H2O."
            },
            {
                q: "13. Why is glass considered a supercooled liquid?",
                a: "Glass is an amorphous solid. Its molecules do not have a regular, long-range ordered crystalline structure. It flows very slowly over long periods of time, similar to a highly viscous liquid, hence it is called a supercooled liquid."
            },
            {
                q: "14. What happens when n-butyl chloride is reacted with alcoholic KOH?",
                a: "n-Butyl chloride undergoes dehydrohalogenation (elimination of HCl) to form 1-butene (a major product) and 2-butene (minor product)."
            },
            {
                q: "15. What is the main constituent of Dettol?",
                a: "The main active constituent of Dettol is Chloroxylenol (4-chloro-3,5-dimethylphenol). It also contains pine oil and isopropyl alcohol."
            },
            {
                q: "16. What type of ores are concentrated by the froth flotation method? Give an example.",
                a: "Sulphide ores are concentrated by froth flotation. Example: Galena (PbS), Zinc blende (ZnS), Copper pyrite (CuFeS2)."
            },
            {
                q: "17. Why do transition elements exhibit variable oxidation states?",
                a: "Transition elements exhibit variable oxidation states because their 4s and 3d electrons have similar energy levels (4s electrons and unpaired 3d electrons can participate in bonding). They can lose different numbers of electrons from these subshells."
            },
            {
                q: "18. The rate constant of a first-order reaction is 0.0005 min-1. Calculate the half-life of this reaction.",
                a: "For a first-order reaction, t(1/2) = 0.693 / k.\nt(1/2) = 0.693 / 0.0005 = 1386 minutes."
            },
            {
                q: "19. What are the members of the halogen family?",
                a: "The halogen family (Group 17) consists of Fluorine (F), Chlorine (Cl), Bromine (Br), Iodine (I), and Astatine (At)."
            },
            {
                q: "20. 4 g of caustic soda (molecular mass = 40) was dissolved in water to make 200 cm3 of solution. Find the molarity of the solution.",
                a: "Moles of NaOH = 4g / 40g/mol = 0.1 mol.\nVolume = 200 cm3 = 0.2 L.\nMolarity (M) = Moles / Volume in L = 0.1 / 0.2 = 0.5 M."
            }
        ];

        // --- LOGIC ---
        let score = 0;
        let answeredCount = 0;

        const objectiveContainer = document.getElementById('objective-container');
        const subjectiveContainer = document.getElementById('subjective-container');
        const scoreVal = document.getElementById('score-val');
        const header = document.getElementById('header');

        // Render MCQs
        mcqs.forEach((mcq, index) => {
            const qBox = document.createElement('div');
            qBox.className = 'neo-box';

            const qTitle = document.createElement('div');
            qTitle.className = 'question-title';
            qTitle.innerText = mcq.q;
            qBox.appendChild(qTitle);

            const optionsGrid = document.createElement('div');
            optionsGrid.className = 'options-container';

            mcq.options.forEach((opt, optIndex) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.innerText = `${String.fromCharCode(65 + optIndex)}. ${opt}`;
                
                btn.onclick = () => {
                    // Prevent multiple answers for the same question
                    if (qBox.classList.contains('answered')) return;
                    qBox.classList.add('answered');

                    answeredCount++;
                    const reasonBox = qBox.querySelector('.reason-box');

                    if (optIndex === mcq.correct) {
                        btn.classList.add('correct');
                        score++;
                        scoreVal.innerText = score;
                        header.classList.add('score-green');
                        setTimeout(() => header.classList.remove('score-green'), 500);
                    } else {
                        btn.classList.add('wrong');
                        // Highlight the correct one
                        optionsGrid.children[mcq.correct].classList.add('correct');
                        header.classList.add('score-red');
                        setTimeout(() => header.classList.remove('score-red'), 500);
                    }

                    // Show reason
                    reasonBox.style.display = 'block';
                    reasonBox.innerHTML = `<strong>Reason:</strong> ${mcq.reason}`;
                    
                    // Disable all buttons in this question
                    Array.from(optionsGrid.children).forEach(b => b.style.cursor = 'default');
                };

                optionsGrid.appendChild(btn);
            });

            qBox.appendChild(optionsGrid);

            const reasonBox = document.createElement('div');
            reasonBox.className = 'reason-box neo-inset';
            qBox.appendChild(reasonBox);

            objectiveContainer.appendChild(qBox);
        });

        // Render Subjectives
        subjectiveQs.forEach((sq, index) => {
            const qBox = document.createElement('div');
            qBox.className = 'neo-box';
            qBox.style.padding = '20px';

            const qTitle = document.createElement('div');
            qTitle.className = 'question-title';
            qTitle.style.marginBottom = '10px';
            qTitle.innerText = sq.q;
            qBox.appendChild(qTitle);

            const showBtn = document.createElement('button');
            showBtn.className = 'subjective-btn';
            showBtn.innerText = 'Show Answer';
            
            const answerBox = document.createElement('div');
            answerBox.className = 'subjective-answer';
            answerBox.innerText = sq.a;

            showBtn.onclick = () => {
                if (answerBox.style.display === 'block') {
                    answerBox.style.display = 'none';
                    showBtn.innerText = 'Show Answer';
                } else {
                    answerBox.style.display = 'block';
                    showBtn.innerText = 'Hide Answer';
                }
            };

            qBox.appendChild(showBtn);
            qBox.appendChild(answerBox);

            subjectiveContainer.appendChild(qBox);
        });

    </script>
</body>
